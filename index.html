<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Guía práctica para plantar y cuidar fresas, manzanilla, hierba para gato, clavel, caléndula, rabanito y zanahoria.">
<title>Guía Verde | Plantar y cuidar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-content">
    <span class="badge">🌱 Guía de jardinería</span>
    <h1>Planta, cuida y aprende</h1>
    <p>Consejos sencillos para cultivar 7 plantas en casa o en tu huerto.</p>
    <a class="hero-btn" href="#plantas">Ver plantas ↓</a>
  </div>
</header>

<main id="plantas" class="container">
  <section class="intro">
    <h2>Elige una planta</h2>
    <p>Selecciona una tarjeta para conocer cómo plantarla, sus cuidados y algunos tips.</p>
  </section>

  <section class="grid" id="plant-grid"></section>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-box">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer>
  <p>🌿 Proyecto de jardinería · Cuida las plantas, cuida la vida.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
